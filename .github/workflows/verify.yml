name: 验证测试与服务器部署
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COLLECT_ON_START: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci && npm test
        working-directory: collector
      - name: 校验三种部署配置
        run: |
          docker compose config --quiet
          docker compose -f compose.collector.yaml config --quiet
          docker compose -f compose.web.yaml config --quiet
      - name: 构建并验证同机部署
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/health
          curl --fail http://localhost:8080/ | grep -qi 'GAME PULSE'
          image=$(find dist/assets/nintendo-hk -type f -print -quit)
          image=${image##*/}
          curl --fail "http://localhost:8080/assets/nintendo-hk/$image" -o /tmp/cover.jpg
          test "$(curl -s -o /tmp/missing-api.json -w '%{http_code}' http://localhost:8080/api/missing)" = 404
          docker compose exec -T collector node --input-type=module -e "import { chromium } from 'playwright'; const b = await chromium.launch({headless:true,args:['--no-sandbox']}); const p = await b.newPage(); await p.setContent('<h1>ok</h1>'); if(await p.textContent('h1') !== 'ok') process.exit(1); await b.close();"
          docker compose down
      - name: 验证前端与收集器分离部署
        env:
          COLLECTOR_BIND: 0.0.0.0
          COLLECTOR_UPSTREAM: http://host.docker.internal:8787
        run: |
          docker compose -p radar-collector -f compose.collector.yaml up -d --build --wait --wait-timeout 180
          docker compose -p radar-web -f compose.web.yaml up -d --build --wait --wait-timeout 90
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/health
          image=$(find dist/assets/nintendo-hk -type f -print -quit)
          image=${image##*/}
          curl --fail "http://localhost:8080/assets/nintendo-hk/$image" -o /tmp/remote-cover.jpg
          test "$(curl -s -o /tmp/remote-api.json -w '%{http_code}' http://localhost:8080/api/missing)" = 404
      - name: 失败时输出日志
        if: failure()
        run: |
          docker compose logs --tail 100
          docker compose -p radar-collector -f compose.collector.yaml logs --tail 100
          docker compose -p radar-web -f compose.web.yaml logs --tail 100
      - name: 清理测试容器
        if: always()
        run: |
          docker compose down
          docker compose -p radar-collector -f compose.collector.yaml down
          docker compose -p radar-web -f compose.web.yaml down
