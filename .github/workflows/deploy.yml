name: Deploy production server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-server
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'DPswxz/DPsWeb1' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, game-price-radar]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        working-directory: collector
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
          $env:npm_config_proxy = $env:HTTP_PROXY
          $env:npm_config_https_proxy = $env:HTTPS_PROXY
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Verify and deploy Docker with existing production data
        run: |
          $config = Get-Content -LiteralPath "$env:USERPROFILE\actions-runner-game-radar\production.json" -Raw | ConvertFrom-Json
          ./scripts/Deploy-GamePulse.ps1 -ProductionRoot $config.productionRoot
